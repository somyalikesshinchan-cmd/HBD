<!DOCTYPE html>
<html>
    <head><style>
     body{background-color: rgb(82, 13, 13);}
     h1{color: rgb(239, 245, 250);
    text-align: center;
font-family: monospace;}
@keyframes slide{
    0%{
        transform: rotate();
        transform: translateY(0vw);
    }
    50%{
        transform: rotate();
        transform: translateY(80vw);
    }
    100%{
        transform: rotate(100px);
    }
}
.motion{
    display: flex;
    gap:20px;
    animation: slide 10s infinite linear;
}
.right{
    display: flex;
}
.popup_msg{
                position: fixed;
                top: 0;
                left:0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.2);
                display: none;
                justify-content: center;
                align-items: center;
                z-index:1000;
            }
            .message{
                background: #6ccddf;
                border: 20px;
                border-radius: 30px;
                text-align: center;
                padding: 40px;
                position: relative;
                width: 70%;
                font-family: cursive;
                box-shadow: 0 8px 24px rgba(201, 87, 87, 0.2)
            }
            .message h2{
                color:rgb(100, 5, 33);
                font-size: 30px;
            }
            .message h3{
                color: rgb(15, 96, 110);
            }
            .btns{
                margin-top: 20px;
                display: flex;
                gap:180px;
                position: relative;
                min-height: 20px;
            }
            .yes-btn{
                background-color: rgb(4, 0, 255);
                padding: 30px;
                border: 2px solid;
                border-radius: 40px;
                color: rgb(183, 233, 4);
                font-family: cursive;
            }
            .no-btn{
                background-color: rgb(100, 45, 45);
                border: 2px solid;
                border-radius: 40px;
                padding: 30px;
                position: relative;
                transition: all 0.1s ease;
            }
    </style></head>
    <!--Let's see how it turns out to be-->
    <body>
        <img src="flowers.gif" alt="flowers">
        <h4>Did you like it?</h4>
    <a href="last.html">YEAH I LOVED IT!!</a>
    <br><br>
    <a href="Sad.html">nah not really</a>
     <h1>I've got you some flowers!!</h1>
     <div class="motion">
     <img src="cat2.jpg" width="350" class="left" alt="Flowers for ya!">
     <img src="hearts.gif" width="400" class="right" alt="hearts!">
     </div>
    <div id="popup" class="popup_msg">
        <div class="message">
            <h2>HEYYYYY!!</h2>
            <h3>Did you like this?</h3>
            <div class="btns">
                <btns class="btn yes-btn" onclick="goToSecondPage()">YEAH I LOVED IT!!!</btns>
                <btns id="nobtn" class="btn no-btn"  onclick="goToThirdPage()">not really</btns>
            </div>
        </div>
    </div> 
<script>
    function goToSecondPage(){
                window.location.href= "last.html";
            }
    function goToThirdPage(){
        window.location="Sad.html";
    }
            function showmessage(){
                const msg= document.getElementById('popup');
                msg.style.display='flex';
            }
            setTimeout(showmessage, 15000);
</script></body>
</html>
